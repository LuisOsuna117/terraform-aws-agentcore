repos:
  - repo: local
    hooks:
      - id: podman-format
        name: Podman format gate
        entry: podman compose run --rm format
        language: system
        pass_filenames: false
      - id: podman-docs
        name: Podman documentation gate
        entry: podman compose run --rm docs-check
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
