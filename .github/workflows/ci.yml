name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.2"
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.2"
          tofu_wrapper: false
      - name: Initialize
        run: tofu init -backend=false
      - name: Validate
        run: tofu validate
      - name: Run module tests
        run: tofu test

  examples:
    name: Example / ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic, browser, code-interpreter, dual-lane-gateways, identity, memory, observability]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.2"
          tofu_wrapper: false
      - run: tofu init -backend=false
      - run: tofu validate

  lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - run: tflint --init
      - run: tflint --config .tflint.hcl

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: terraform-docs/gh-actions@v1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          git-push: "false"
          fail-on-diff: "true"
          args: --lockfile=false

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan IaC
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH
          format: table
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
      - name: Create SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        with:
          scan-type: config
          scan-ref: .
          exit-code: "0"
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save @semantic-release/release-notes-generator@14.1.1 conventional-changelog-conventionalcommits@9.3.1
      - run: node scripts/verify-release-notes.mjs
