name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Podman / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [format, test, lint, docs-check, security, release-notes]

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman Compose
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose

      - name: Validate Compose configuration
        run: podman compose config

      - name: Run ${{ matrix.service }}
        run: podman compose run --rm ${{ matrix.service }}
