name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Public contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Reject stale interfaces and incomplete matrices
        run: bash scripts/check-public-contract.sh

  # ----------------------------------------------------------------------------
  # 1. Format
  # ----------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.2"
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive -diff

  # ----------------------------------------------------------------------------
  # 2. Validate (root module + examples)
  # ----------------------------------------------------------------------------
  validate:
    name: Validate (${{ matrix.path }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        path:
          - .
          - examples/basic
          - examples/byo-image
          - examples/codebuild-no-trigger
          - examples/gateway-only
          - examples/gateway-runtime-target
          - examples/gateway-multiple-targets
          - examples/runtime-gateway-self-target
          - examples/identity
          - examples/policy
          - examples/resource-policy
          - examples/browser
          - examples/managed-harness
          - examples/evaluation
          - examples/runtime-endpoint
          - examples/memory-strategy
          - examples/single-runtime-governance
          - examples/gateway-target
          - examples/gateway-rule
          - examples/gateway-connector-target

    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.2"
          tofu_wrapper: false

      - name: Init
        working-directory: ${{ matrix.path }}
        run: tofu init -backend=false

      - name: Validate
        working-directory: ${{ matrix.path }}
        run: tofu validate

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.2"
          tofu_wrapper: false

      - name: Init
        run: tofu init -backend=false

      - name: Run module tests
        run: tofu test

      - name: Check connector lifecycle handler syntax
        run: python -m py_compile modules/gateway-connector-target/handler.py

  terraform-compat:
    name: Terraform 1.11 compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate and test root module
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Validate native Gateway Target example
        working-directory: examples/gateway-target
        run: |
          terraform init -backend=false
          terraform validate

  # ----------------------------------------------------------------------------
  # 3. Lint (TFLint)
  # ----------------------------------------------------------------------------
  tflint:
    name: TFLint (${{ matrix.path }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        path:
          - .
          - examples/basic
          - examples/byo-image
          - examples/codebuild-no-trigger
          - examples/gateway-only
          - examples/gateway-runtime-target
          - examples/gateway-multiple-targets
          - examples/runtime-gateway-self-target
          - examples/identity
          - examples/policy
          - examples/resource-policy
          - examples/browser
          - examples/managed-harness
          - examples/evaluation
          - examples/runtime-endpoint
          - examples/memory-strategy
          - examples/single-runtime-governance
          - examples/gateway-target
          - examples/gateway-rule
          - examples/gateway-connector-target

    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Lint
        working-directory: ${{ matrix.path }}
        run: tflint --config ${{ matrix.path == '.' && '.tflint.hcl' || '../../.tflint.hcl' }}

  # ----------------------------------------------------------------------------
  # 4. Security scan (Trivy)
  # ----------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write   # upload SARIF to GitHub Code Scanning

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"           # fail the job if CRITICAL/HIGH findings exist
          severity: CRITICAL,HIGH
          format: table
          trivy-config: trivy.yaml
          trivyignores: .trivyignore

      - name: Run Trivy (IaC) — emit SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        with:
          scan-type: config
          scan-ref: .
          exit-code: "0"           # never block — SARIF upload is informational
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          trivy-config: trivy.yaml
          trivyignores: .trivyignore

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ----------------------------------------------------------------------------
  # 5. Docs drift check
  # ----------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # terraform-docs needs write-access to check diff; grant fetch only.
          ref: ${{ github.head_ref }}

      - name: Check terraform-docs drift
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: .,modules/browser,modules/build,modules/code-interpreter,modules/evaluation,modules/gateway,modules/gateway-connector-target,modules/gateway-rule,modules/gateway-runtime-target-schema,modules/gateway-target,modules/identity,modules/managed-harness,modules/memory,modules/memory-strategy,modules/policy,modules/temporal-policy,modules/runtime,modules/runtime-endpoint
          output-file: README.md
          output-method: inject
          git-push: "false"
          fail-on-diff: "true"
          args: --lockfile=false

  # ----------------------------------------------------------------------------
  # 6. Release notes smoke test
  # ----------------------------------------------------------------------------
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install release notes dependencies
        run: |
          npm install --no-save \
            "@semantic-release/release-notes-generator@14.1.1" \
            conventional-changelog-conventionalcommits@9.3.1

      - name: Verify release notes rendering
        run: node scripts/verify-release-notes.mjs
